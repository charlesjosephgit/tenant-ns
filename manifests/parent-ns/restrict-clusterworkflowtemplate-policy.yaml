# Limits which namespaces may reference cluster-scoped WorkflowTemplates.
#
# WHY NOT RBAC: `clusterworkflowtemplates` is cluster-scoped, and a ClusterRole
# cannot be restricted per namespace. Worse, RBAC on the caller only gates the
# argo-server submit path — a direct `kubectl create workflow` with a
# workflowTemplateRef is resolved by the workflow-controller using the
# CONTROLLER's permissions, so the submitter never needs read access to the
# template at all.
#
# A ValidatingAdmissionPolicy runs in the API server on the Workflow object
# itself, so it applies to every path — argo-server, kubectl, CronWorkflows,
# and cluster-admins alike. That last part is what no RBAC rule can do.
#
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy is GA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-cluster-workflow-templates
spec:
  # Fail closed: if the policy cannot be evaluated, reject rather than admit.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workflows"]
  variables:
    # Allowlist. Kept in step with the ClusterExternalSecret and
    # ClusterSecretStore lists — all three must name the same tenants.
    - name: allowedNamespaces
      expression: "['parent-ns', 'tenant-ns', 'negative-ns']"

    # Templates this policy guards, by name.
    #
    # SCOPED BY NAME ON PURPOSE — and this fails open for anything not listed.
    # A ClusterWorkflowTemplate added later is referenceable from ANY namespace
    # until its name is added here. Add the name at the same time you create
    # the template, or it is unprotected.
    - name: protectedTemplates
      expression: "['tenant-shared-ops']"

    # True only when this Workflow reaches for one of the guarded cluster
    # templates. Namespaced workflowTemplateRefs are none of this policy's
    # business, and neither are unlisted cluster templates.
    - name: usesProtectedTemplate
      expression: >-
        has(object.spec) &&
        has(object.spec.workflowTemplateRef) &&
        has(object.spec.workflowTemplateRef.clusterScope) &&
        object.spec.workflowTemplateRef.clusterScope == true &&
        has(object.spec.workflowTemplateRef.name) &&
        object.spec.workflowTemplateRef.name in variables.protectedTemplates
  validations:
    - expression: >-
        !variables.usesProtectedTemplate ||
        (request.namespace in variables.allowedNamespaces)
      message: >-
        This ClusterWorkflowTemplate may only be referenced from approved
        tenant namespaces. Add this namespace to allowedNamespaces in
        manifests/parent-ns/restrict-clusterworkflowtemplate-policy.yaml.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-cluster-workflow-templates
spec:
  policyName: restrict-cluster-workflow-templates
  # Deny outright rather than only recording an audit annotation.
  validationActions: ["Deny"]
