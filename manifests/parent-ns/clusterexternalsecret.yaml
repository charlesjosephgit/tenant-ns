apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: tenant-workflow-credentials
spec:
  # Name of the ExternalSecret created inside each matched namespace.
  externalSecretName: tenant-workflow-credentials

  # Explicit allowlist of tenant namespaces, pinned by name.
  #
  # `kubernetes.io/metadata.name` is set automatically by Kubernetes on every
  # namespace, so this needs no custom labelling. Chosen over a `tenant=true`
  # matchLabels selector because a label can be self-granted: anyone able to
  # label a namespace could otherwise hand themselves this secret. The tenant
  # list now changes only through a reviewed commit.
  #
  # Onboarding a tenant = add its name here, commit, let ArgoCD sync.
  #
  # Note: spec.namespaces would express the same thing, but it is deprecated
  # in favour of namespaceSelectors. status.provisionedNamespaces is NOT
  # settable — it is controller output reporting where this actually landed.
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - parent-ns
            - tenant-ns

  # How often to re-evaluate which namespaces match.
  refreshTime: 1h

  externalSecretSpec:
    secretStoreRef:
      name: tenant-shared-store
      kind: ClusterSecretStore
    refreshInterval: 1h
    target:
      name: tenant-workflow-credentials
      creationPolicy: Owner
    data:
      - secretKey: api-endpoint
        remoteRef:
          key: /tenant/api-endpoint
      - secretKey: api-token
        remoteRef:
          key: /tenant/api-token
