apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: tenant-workflow-credentials
spec:
  # Name of the ExternalSecret created inside each matched namespace.
  externalSecretName: tenant-workflow-credentials

  # Tenants are the parent-ns subtree, selected by their HNC tree label.
  #
  # `<parent>.tree.hnc.x-k8s.io/depth` is stamped on every descendant by the
  # HNC controller, and parent-ns carries its own at depth 0 — so this one
  # selector covers parent-ns and every namespace beneath it.
  #
  # This is label-based, but NOT the self-grantable kind we rejected earlier:
  # HNC's webhook owns these labels and refuses manual edits, so a namespace
  # cannot label its way into the tenant set. It has to be made a child of
  # parent-ns, which is itself an authorised operation.
  #
  # Onboarding a tenant = set its parent to parent-ns. No edit here.
  #
  # Note: spec.namespaces would express a static list, but it is deprecated in
  # favour of namespaceSelectors. status.provisionedNamespaces is NOT settable
  # — it is controller output reporting where this actually landed.
  namespaceSelectors:
    - matchExpressions:
        - key: parent-ns.tree.hnc.x-k8s.io/depth
          operator: Exists

  # How often to re-evaluate which namespaces match.
  refreshTime: 1h

  externalSecretSpec:
    secretStoreRef:
      name: tenant-shared-store
      kind: ClusterSecretStore
    refreshInterval: 1h
    target:
      name: tenant-workflow-credentials
      creationPolicy: Owner
    data:
      - secretKey: api-endpoint
        remoteRef:
          key: /tenant/api-endpoint
      - secretKey: api-token
        remoteRef:
          key: /tenant/api-token
