# Read-only identity for logging into the Argo Workflows UI as parent-ns.
#
# With argo-server in --auth-mode=client the UI has no login of its own: you
# paste a ServiceAccount token, and what you can see is exactly what that SA's
# RBAC allows. This token shows parent-ns; the tenant equivalent lives in
# manifests/tenant-ns/argo-ui.yaml.
#
# Deliberately read-only — no create/delete on workflows. To let a UI user
# submit or resubmit, add "create" on workflows to the Role below.
#
# Fetch a token with: ./scripts/argo-ui-token.sh parent-ns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui
  namespace: parent-ns
---
# The UI lists cluster-scoped templates on load, so this needs a ClusterRole.
# Without it the Cluster Workflow Templates page returns 403.
#
# Cluster-scoped, so it ships with the parent-ns app — but it deliberately
# names the tenant-ns SA too, so both UI logins work from one binding. RBAC
# permits naming a subject that does not exist yet, so ordering between the
# two apps does not matter.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-ui-cluster-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["clusterworkflowtemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-ui-reads-clusterworkflowtemplates
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: parent-ns
  - kind: ServiceAccount
    name: argo-ui
    namespace: tenant-ns
roleRef:
  kind: ClusterRole
  name: argo-ui-cluster-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-ui-viewer
  namespace: parent-ns
  annotations:
    # HNC copies Roles/RoleBindings to descendants verbatim. Each namespace
    # needs its OWN argo-ui binding pointing at its OWN SA, so this pair must
    # not descend — otherwise tenant-ns would be granted to parent-ns/argo-ui
    # and lose its own binding, inverting the per-namespace UI scoping.
    propagate.hnc.x-k8s.io/none: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch"]
  # Log streaming watches pods and then reads their logs — both are needed,
  # `pods/log` alone yields "cannot watch resource pods".
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-ui-viewer
  namespace: parent-ns
  annotations:
    propagate.hnc.x-k8s.io/none: "true"
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: parent-ns
roleRef:
  kind: Role
  name: argo-ui-viewer
  apiGroup: rbac.authorization.k8s.io
