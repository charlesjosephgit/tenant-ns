apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tenant-shared-store
spec:
  # Restricts which namespaces may REFERENCE this store.
  #
  # Without this, the ClusterExternalSecret allowlist is only half a control:
  # it governs where ESO pushes secrets, but any namespace could still create
  # its own ExternalSecret pointing at this store and pull the same material.
  # Verified — an unlisted namespace retrieved the token that way.
  #
  # Conditions are ORed, and each supports namespaces / namespaceSelector /
  # namespaceRegexes. Pinned by name to match the ClusterExternalSecret.
  conditions:
    - namespaces:
        - parent-ns
        - tenant-ns
  provider:
    # Local development backend. The `fake` provider serves these literals
    # inline, so no credentials or external service are required.
    # Swap this block for `vault:`/`aws:`/etc. when a real backend exists —
    # the ClusterExternalSecret referencing this store needs no changes.
    fake:
      # No `version:` here — the fake provider matches on key AND version,
      # and the ClusterExternalSecret's remoteRefs request no version.
      data:
        - key: /tenant/api-endpoint
          value: https://api.internal.example.com
        - key: /tenant/api-token
          value: dev-placeholder-token
