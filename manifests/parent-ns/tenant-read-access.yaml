# Lets workloads in tenant-ns read Secrets that live in parent-ns, via the
# Kubernetes API.
#
# Scoped to secrets only. Shared non-secret config no longer needs a grant at
# all: it is carried inline as a raw artifact in the tenant-shared-ops
# ClusterWorkflowTemplate, which is cluster-scoped and therefore already
# visible from every tenant namespace.
#
# NOTE: this grants API read access only. A pod in tenant-ns still cannot
# mount a parent-ns ConfigMap/Secret as a volume, or pull it in with envFrom
# or secretKeyRef — those references are resolved strictly within the pod's
# own namespace. Reaching this data from a container means calling the API
# (kubectl / client-go / an initContainer), or replicating the object into
# tenant-ns, which is what the ClusterExternalSecret already does.
#
# Both objects are namespaced to parent-ns: a RoleBinding grants access to
# resources in ITS OWN namespace, while its subjects may live elsewhere.
#
# HNC: both objects are marked non-propagating. HNC always propagates Roles and
# RoleBindings to descendant namespaces and copies them VERBATIM, so without
# this annotation tenant-ns would receive its own copy of the pair below —
# granting tenant-ns/default get/list/watch on secrets IN TENANT-NS, which it
# cannot do today. The binding's subject is already tenant-ns/default, so the
# propagated copy would be self-referential and silently escalate privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: parent-ns-config-reader
  namespace: parent-ns
  annotations:
    propagate.hnc.x-k8s.io/none: "true"
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-ns-reads-parent-ns
  namespace: parent-ns
  annotations:
    propagate.hnc.x-k8s.io/none: "true"
subjects:
  # The subject lives in tenant-ns; the permissions apply in parent-ns.
  - kind: ServiceAccount
    name: default
    namespace: tenant-ns
roleRef:
  kind: Role
  name: parent-ns-config-reader
  apiGroup: rbac.authorization.k8s.io
