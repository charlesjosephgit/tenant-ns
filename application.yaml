apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-namespace-sample
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charlesjosephgit/tenant-ns.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: parent-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
