# Read-only identities for logging into the Argo Workflows UI, one per
# namespace. With argo-server in --auth-mode=client the UI has no login of its
# own: you paste a ServiceAccount token, and what you can see is exactly what
# that SA's RBAC allows. A token for the parent-ns SA therefore shows parent-ns
# workflows, and likewise for tenant-ns.
#
# Deliberately read-only — no create/delete on workflows. To let a UI user
# submit or resubmit, add "create" on workflows to that namespace's Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui
  namespace: parent-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui
  namespace: tenant-ns
---
# The UI lists cluster-scoped templates on load, so this needs a ClusterRole.
# Without it the Cluster Workflow Templates page returns 403.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-ui-cluster-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["clusterworkflowtemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-ui-reads-clusterworkflowtemplates
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: parent-ns
  - kind: ServiceAccount
    name: argo-ui
    namespace: tenant-ns
roleRef:
  kind: ClusterRole
  name: argo-ui-cluster-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-ui-viewer
  namespace: parent-ns
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch"]
  # Log streaming watches pods and then reads their logs — both are needed,
  # `pods/log` alone yields "cannot watch resource pods".
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-ui-viewer
  namespace: parent-ns
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: parent-ns
roleRef:
  kind: Role
  name: argo-ui-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-ui-viewer
  namespace: tenant-ns
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-ui-viewer
  namespace: tenant-ns
subjects:
  - kind: ServiceAccount
    name: argo-ui
    namespace: tenant-ns
roleRef:
  kind: Role
  name: argo-ui-viewer
  apiGroup: rbac.authorization.k8s.io
