apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: tenant-shared-ops
spec:
  entrypoint: main
  # Bound to parent-ns by parent-ns-read-rolebinding.yaml, which is what makes
  # the cross-namespace secret read below succeed.
  serviceAccountName: default
  arguments:
    parameters:
      - name: message
        value: "hello from the shared cluster template"
  templates:
    - name: main
      inputs:
        parameters:
          - name: message
      dag:
        tasks:
          - name: local-secret
            template: show-local-secret
            arguments:
              parameters:
                - name: message
                  value: "{{inputs.parameters.message}}"
          - name: shared-config
            template: read-shared-config
          - name: parent-secret
            template: read-parent-secret

    # Same-namespace access: the Secret that the ClusterExternalSecret
    # materialises into this tenant namespace can be mounted as env vars.
    - name: show-local-secret
      inputs:
        parameters:
          - name: message
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "message:  {{inputs.parameters.message}}"
            echo "endpoint: $API_ENDPOINT"
            # Length only — never echo the token itself into workflow logs.
            echo "token:    ${#API_TOKEN} chars"
        env:
          - name: API_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: tenant-workflow-credentials
                key: api-endpoint
          - name: API_TOKEN
            valueFrom:
              secretKeyRef:
                name: tenant-workflow-credentials
                key: api-token

    # Shared non-secret config, carried by this template rather than by a
    # ConfigMap. A ClusterWorkflowTemplate is cluster-scoped, so every tenant
    # namespace resolves the same copy — no replication, no cross-namespace
    # RBAC. The raw artifact lands as a real file at `path`, so it is a
    # drop-in replacement for a mounted ConfigMap volume.
    #
    # NEVER put secret material here: this object is readable by anyone with
    # `get` on clusterworkflowtemplates, and the values render into every
    # Workflow spec and the Argo UI. Secrets stay in ESO.
    - name: read-shared-config
      inputs:
        artifacts:
          - name: config
            path: /etc/tenant/config.yaml
            raw:
              data: |
                region: eu-west-1
                tier: shared
                endpoints:
                  - https://a.internal
                  - https://b.internal
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "shared config, inlined from the template:"
            cat /etc/tenant/config.yaml

    # Cross-namespace access: parent-ns objects CANNOT be mounted from a
    # tenant-ns pod, so the Secret must be fetched through the Kubernetes API.
    #
    # Two constraints shape this step:
    #   1. rancher/kubectl is distroless — no shell, so `command: [sh, -c]`
    #      fails. kubectl is the entrypoint; pass bare args.
    #   2. Use jsonpath, NOT go-template. Argo substitutes `{{...}}` itself
    #      and would fail to resolve go-template braces as workflow variables.
    - name: read-parent-secret
      container:
        image: rancher/kubectl:v1.31.0
        # `-o name` deliberately: a successful GET proves the RBAC grant
        # without spilling secret material into workflow logs, which are
        # readable by anyone with Argo UI access.
        args:
          - get
          - secret
          - parent-shared-secret
          - --namespace=parent-ns
          - -o
          - name
