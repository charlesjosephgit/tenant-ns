apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: tenant-shared-ops
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: message
        value: "hello from the shared cluster template"
  templates:
    - name: main
      inputs:
        parameters:
          - name: message
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            echo "message:  {{inputs.parameters.message}}"
            echo "endpoint: $API_ENDPOINT"
            # Length only — never echo the token itself into workflow logs.
            echo "token:    ${#API_TOKEN} chars"
        env:
          # Resolved from the Secret that the ClusterExternalSecret
          # materializes in whichever tenant namespace the Workflow runs in.
          - name: API_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: tenant-workflow-credentials
                key: api-endpoint
          - name: API_TOKEN
            valueFrom:
              secretKeyRef:
                name: tenant-workflow-credentials
                key: api-token
