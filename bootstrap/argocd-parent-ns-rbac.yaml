# Required by ArgoCD's "Applications in any namespace" feature.
#
# Enabling `application.namespaces` in argocd-cmd-params-cm and adding
# `sourceNamespaces` to the AppProject is NOT sufficient: argocd-server also
# needs explicit RBAC in each app namespace. Without it the UI Sync button
# fails with:
#
#   applications.argoproj.io "cluster-resources" is forbidden: User
#   "system:serviceaccount:argocd:argocd-server" cannot update resource
#   "applications" in API group "argoproj.io" in the namespace "parent-ns"
#
# Reconciliation still works without this, because argocd-application-
# controller holds a cluster-wide role in the default install — which is why
# the failure only shows up when syncing from the UI.
#
# NOT under manifests/: this grants the permission needed to manage
# that very app. Delivering it through the app would be circular, and a prune
# would lock you out. It belongs with the ArgoCD installation, so apply it
# out of band:
#
#   kubectl apply -f bootstrap/argocd-parent-ns-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-server
  namespace: parent-ns
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-server
  namespace: parent-ns
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-server
  apiGroup: rbac.authorization.k8s.io
---
# The controller currently reaches parent-ns via its cluster-wide role. This
# binding makes the dependency explicit, so the app keeps reconciling if that
# cluster-wide role is ever tightened.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-application-controller
  namespace: parent-ns
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller
  namespace: parent-ns
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-application-controller
  apiGroup: rbac.authorization.k8s.io
