# negative-ns app: everything scoped to the tenant namespace.
#
# Holds no cluster-scoped objects by design. Deleting or breaking this app
# affects negative-ns only — it cannot take down shared infrastructure, which
# is the point of splitting the two.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: negative-ns-resources
  # Lives in parent-ns, the management namespace, alongside the parent app.
  # Putting it in negative-ns instead would mean adding negative-ns to
  # `application.namespaces` and giving argocd-server RBAC there — and would
  # hand tenants edit access to their own Application.
  namespace: negative-ns
spec:
  project: default
  source:
    repoURL: https://github.com/charlesjosephgit/tenant-ns.git
    targetRevision: main
    path: manifests/negative-ns
  destination:
    server: https://kubernetes.default.svc
    namespace: negative-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
