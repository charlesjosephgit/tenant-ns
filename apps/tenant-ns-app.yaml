# Tenant-ns app: everything scoped to the tenant namespace.
#
# Holds no cluster-scoped objects by design. Deleting or breaking this app
# affects tenant-ns only — it cannot take down shared infrastructure, which
# is the point of splitting the two.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-ns-resources
  # Lives alongside the resources it manages. This requires tenant-ns in
  # `application.namespaces` (argocd-cmd-params-cm), in the AppProject's
  # `sourceNamespaces`, and a Role/RoleBinding pair for argocd-server and
  # argocd-application-controller — see bootstrap/argocd-app-namespaces-rbac.yaml.
  #
  # Trade-off of this placement: anyone with edit rights in tenant-ns can now
  # modify this Application, and so redirect what gets deployed into their own
  # namespace. Keep it in parent-ns instead if tenants are not trusted that far.
  namespace: tenant-ns
spec:
  project: default
  source:
    repoURL: https://github.com/charlesjosephgit/tenant-ns.git
    targetRevision: main
    path: manifests/tenant-ns
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
